[package]
name = "kic-lib"
description = "A library specifically enabling communication to Tektronix and Keithley, TSP-enabled instruments"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }

[dependencies]
bytes = { workspace = true }
colored = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
visa-rs = { version = "0.6.2", optional = true }
indicatif = "0.18.4"
roxmltree = { version = "0.20.0", default-features = false, features = ["std"] }
keyring-core = "1.0.1"
rustls = { version = "0.23.41" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }


[features]
visa = ["dep:visa-rs"]

[dev-dependencies]
anyhow = "1"
bytes = "1"
colored = "2"
mockall = { version = "0.12" }
assert_matches = "1.5.0"

[lints]
workspace = true
